<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Hitster</title>
  <!-- Library for HTML5 QR Code Scanning -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .score-board {
      background: #282828;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #1db954;
      display: inline-block;
      margin-bottom: 12px;
    }
    .card-id {
      color: #1db954;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }
    h1 { color: #ffffff; font-size: 22px; margin: 5px 0; }
    p { color: #b3b3b3; font-size: 13px; margin-bottom: 15px; }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="number"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #282828;
      color: #fff;
      font-size: 14px;
      text-align: center;
    }
    .btn-select {
      padding: 10px 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-qr {
      width: 100%;
      padding: 10px;
      background-color: #2980b9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
    }

    /* QR Camera Modal Box */
    #qr-reader-container {
      display: none;
      background: #000;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
    }
    #qr-reader { width: 100%; }

    .timer-display {
      font-size: 14px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 8px;
    }

    .player-container {
      width: 100%;
      height: 80px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      background-color: #282828;
      position: relative;
    }
    
    .player-container iframe {
      width: 100%;
      height: 152px;
      border: 0;
      position: absolute;
      top: -72px;
      left: 0;
    }

    .player-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 78%;
      height: 100%;
      background-color: #282828;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1db954;
      font-size: 13px;
      font-weight: bold;
      z-index: 10;
    }

    .start-overlay, .time-out-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .start-overlay button {
      background-color: #1db954;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .time-out-overlay {
      display: none;
      background-color: #121212;
      color: #e74c3c;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    .btn-reveal { background-color: #1db954; color: #ffffff; }
    .btn-coin { background-color: #f1c40f; color: #000000; }

    .answer-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #282828;
      border-radius: 8px;
      display: none;
      border: 1px solid #1db954;
    }
    .song-title { font-size: 18px; font-weight: bold; color: #ffffff; }
    .artist-name { font-size: 14px; color: #b3b3b3; margin-top: 4px; }
    .release-year { font-size: 30px; font-weight: bold; color: #1db954; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="score-board">🪙 Hitster Coins: <span id="coinCount">0</span></div>
    
    <div class="input-group">
      <input type="number" id="manualCardInput" placeholder="Enter Card # (1-250)" min="1" max="250">
      <button class="btn-select" onclick="loadManualCard()">Go</button>
    </div>

    <!-- Camera Trigger -->
    <button class="btn-qr" onclick="startScanner()">📷 Scan Card QR Code</button>

    <!-- Camera Video Box -->
    <div id="qr-reader-container">
      <div id="qr-reader"></div>
    </div>

    <div class="card-id" id="cardDisplayId">CARD ---</div>
    <h1>🎵 Indian Hitster</h1>
    <p>Listen to the track, guess the details, then reveal!</p>

    <div class="timer-display" id="timerText">⏱ Time Remaining: 30s</div>

    <div class="player-container">
      <iframe id="spotifyPlayer" src="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <div class="player-mask">🔒 Secret Track</div>
      
      <div class="start-overlay" id="startOverlay">
        <button onclick="startListening()">▶ Start 30s Clip</button>
      </div>

      <div class="time-out-overlay" id="timeOutOverlay">🛑 Time's Up! Make your guess.</div>
    </div>

    <button class="btn-action btn-reveal" onclick="revealAnswer()">👁 Reveal Song, Artist & Year</button>

    <div id="answerBox" class="answer-box">
      <div class="song-title" id="songTitle">---</div>
      <div class="artist-name" id="artistName">---</div>
      <div class="release-year" id="releaseYear">----</div>
      <button class="btn-action btn-coin" onclick="addCoin()">+1 Hitster Coin!</button>
    </div>
  </div>

  <script>
    let coins = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let html5QrcodeScanner = null;

    const songs = {
      1: { title: "Mere Sapno Ki Rani", artist: "Kishore Kumar", year: "1969", spotifyId: "098jYib9xwJFe6W4eIL5Ok" },
      2: { title: "Pyaar Deewana Hota Hai", artist: "Kishore Kumar", year: "1971", spotifyId: "0Yu6DMaU2w0777Ek5XQNyI" },
      3: { title: "Dum Maro Dum", artist: "Asha Bhosle", year: "1971", spotifyId: "4u7jmbLddehSmDXzTugvnI" }
    };

    function startScanner() {
      const container = document.getElementById("qr-reader-container");
      container.style.display = "block";

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 200 });
        html5QrcodeScanner.render((decodedText) => {
          // Extract card number from URL parameter or raw ID text
          const matchedId = decodedText.match(/id=(\d+)/) || decodedText.match(/^(\d+)$/);
          if (matchedId && songs[matchedId[1]]) {
            loadCard(parseInt(matchedId[1]));
            html5QrcodeScanner.clear();
            container.style.display = "none";
          } else {
            alert("Scanned QR is not a valid card!");
          }
        });
      }
    }

    function startListening() {
      document.getElementById("startOverlay").style.display = "none";
      clearInterval(timerInterval);
      timeLeft = 30;
      document.getElementById("timerText").innerText = "⏱ Time Remaining: 30s";

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timerText").innerText = "⏱ Time Remaining: " + timeLeft + "s";
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById("timerText").innerText = "⏱ Time's Up!";
          document.getElementById("timeOutOverlay").style.display = "flex";
        }
      }, 1000);
    }

    function loadCard(id) {
      clearInterval(timerInterval);
      const currentSong = songs[id] || songs[1];
      
      document.getElementById("cardDisplayId").innerText = "CARD " + String(id).padStart(3, '0');
      document.getElementById("spotifyPlayer").src = "https://open.spotify.com/embed/track/" + currentSong.spotifyId + "?utm_source=generator&theme=0";
      
      document.getElementById("answerBox").style.display = "none";
      document.getElementById("timeOutOverlay").style.display = "none";
      document.getElementById("startOverlay").style.display = "flex";
      document.getElementById("timerText").innerText = "⏱ Time Remaining: 30s";

      document.getElementById("songTitle").innerText = currentSong.title;
      document.getElementById("artistName").innerText = "Artist: " + currentSong.artist;
      document.getElementById("releaseYear").innerText = currentSong.year;
    }

    function loadManualCard() {
      const inputVal = parseInt(document.getElementById("manualCardInput").value);
      if (inputVal && songs[inputVal]) {
        loadCard(inputVal);
      } else {
        alert("Card not found! Please enter a valid card number.");
      }
    }

    function revealAnswer() {
      clearInterval(timerInterval);
      document.getElementById("answerBox").style.display = "block";
    }

    function addCoin() {
      coins++;
      document.getElementById("coinCount").innerText = coins;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const initialCardId = parseInt(urlParams.get('id')) || 1;
    loadCard(initialCardId);
  </script>

</body>
</html>
