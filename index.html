<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .score-board {
      background: #282828;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #1db954;
      display: inline-block;
      margin-bottom: 12px;
    }
    .card-id {
      color: #1db954;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }
    h1 { color: #ffffff; font-size: 22px; margin: 5px 0; }
    p { color: #b3b3b3; font-size: 13px; margin-bottom: 15px; }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="number"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #282828;
      color: #fff;
      font-size: 14px;
      text-align: center;
    }
    .btn-select {
      padding: 10px 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qr {
      width: 100%;
      padding: 12px;
      background-color: #2980b9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
      font-size: 15px;
    }
    #qr-reader-container {
      display: none;
      background: #000;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
    }
    #qr-reader { width: 100%; }

    .timer-display {
      font-size: 15px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 12px;
    }

    .player-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-player {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-play { background-color: #1db954; color: #fff; }
    .btn-pause { background-color: #e74c3c; color: #fff; }

    .btn-action {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    .btn-reveal { background-color: #333; color: #ffffff; border: 1px solid #555; }
    .btn-coin { background-color: #f1c40f; color: #000000; }

    .answer-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #282828;
      border-radius: 8px;
      display: none;
      border: 1px solid #1db954;
    }
    .song-title { font-size: 18px; font-weight: bold; color: #ffffff; }
    .artist-name { font-size: 14px; color: #b3b3b3; margin-top: 4px; }
    .release-year { font-size: 30px; font-weight: bold; color: #1db954; margin-top: 6px; }

    #youtube-player-container { display: none; }
  </style>
</head>

    <div class="input-group">
      <input type="number" id="manualCardInput" placeholder="Card # (1-50)" min="1" max="50">
      <button class="btn-select" onclick="loadManualCard()">Go</button>
    </div>

    <button class="btn-qr" onclick="startScanner()">📷 Scan Physical Card QR</button>

    <div id="qr-reader-container">
      <div id="qr-reader"></div>
    </div>

    <div class="card-id" id="cardDisplayId">CARD ---</div>
    <h1>🎵 Indian Hitster</h1>
    <p>Scan a physical card to play the song!</p>

    <div class="timer-display" id="timerText">⏱ 30s Ready</div>

    <div class="player-controls">
      <button class="btn-player btn-play" onclick="playAudioClip()">▶ Play Clip</button>
      <button class="btn-player btn-pause" onclick="pauseAudioClip()">⏸ Pause</button>
    </div>

    <button class="btn-action btn-reveal" id="revealBtn" onclick="toggleRevealAnswer()">👁 Reveal Song, Artist & Year</button>

    <div id="answerBox" class="answer-box">
      <div class="song-title" id="songTitle">---</div>
      <div class="artist-name" id="artistName">---</div>
      <div class="release-year" id="releaseYear">----</div>
      <button class="btn-action btn-coin" onclick="addCoin()">+1 Hitster Coin!</button>
    </div>
  </div>

  </div>

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        videoId: songs["1"].youtubeId,
        playerVars: { 'playsinline': 1 },
        events: {
          'onReady': (event) => {
            isPlayerReady = true;
            loadCard("1");
          }
        }
      });
    }

    function startScanner() {
      const container = document.getElementById("qr-reader-container");
      container.style.display = "block";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        (decodedText) => {
          const matchedId = decodedText.match(/id=(\d+)/) || decodedText.match(/\d+/);
          if (matchedId) {
            const cardNum = matchedId[1] || matchedId[0];
            html5QrCode.stop().then(() => {
              container.style.display = "none";
              loadCard(cardNum);
            }).catch(() => {
              container.style.display = "none";
              loadCard(cardNum);
            });
          }
        },
        () => {}
      ).catch(() => {
        alert("Camera permission denied or unavailable.");
        container.style.display = "none";
      });
    }

    function loadCard(id) {
      if (!songs[id]) id = "1";
      currentSongId = id;
      
      clearInterval(timerInterval);
      timeLeft = 30;
      document.getElementById("timerText").innerText = "⏱ 30s Ready";

      let currentSong = songs[id];
      document.getElementById("cardDisplayId").innerText = "CARD " + String(id).padStart(3, '0');
      
      if (isPlayerReady && ytPlayer) {
        ytPlayer.cueVideoByUrl({
          mediaContentUrl: `https://www.youtube.com/watch?v=${currentSong.youtubeId}`,
          startSeconds: currentSong.startTime
        });
      }
      
      document.getElementById("answerBox").style.display = "none";
      document.getElementById("revealBtn").innerText = "👁 Reveal Song, Artist & Year";

      document.getElementById("songTitle").innerText = currentSong.title;
      document.getElementById("artistName").innerText = "Artist: " + currentSong.artist;
      document.getElementById("releaseYear").innerText = currentSong.year;
    }

    function playAudioClip() {
      if (!isPlayerReady || !ytPlayer) {
        alert("Player is still loading, please wait a second.");
        return;
      }

      let currentSong = songs[currentSongId];
      ytPlayer.loadVideoById({
        videoId: currentSong.youtubeId,
        startSeconds: currentSong.startTime
      });

      clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timerText").innerText = "⏱ Time Remaining: " + timeLeft + "s";
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          ytPlayer.pauseVideo();
          document.getElementById("timerText").innerText = "⏱ Time's Up!";
        }
      }, 1000);
    }

    function pauseAudioClip() {
      if (ytPlayer) ytPlayer.pauseVideo();
      clearInterval(timerInterval);
      document.getElementById("timerText").innerText = "⏱ Paused (" + timeLeft + "s left)";
    }

    function loadManualCard() {
      const inputVal = document.getElementById("manualCardInput").value;
      if (songs[inputVal]) {
        loadCard(inputVal);
      } else {
        alert("Please enter a valid card number (1-50).");
      }
    }

    function toggleRevealAnswer() {
      const answerBox = document.getElementById("answerBox");
      const revealBtn = document.getElementById("revealBtn");

      if (answerBox.style.display === "block") {
        answerBox.style.display = "none";
        revealBtn.innerText = "👁 Reveal Song, Artist & Year";
      } else {
        if (ytPlayer) ytPlayer.pauseVideo();
        clearInterval(timerInterval);
        answerBox.style.display = "block";
        revealBtn.innerText = "🔒 Hide Answer";
      }
    }

    function addCoin() {
      coins++;
      document.getElementById("coinCount").innerText = coins;
    }

    const initialCardId = urlParams.get('id');
    if (initialCardId && songs[initialCardId]) {
      // Handled via onReady callback
    }
