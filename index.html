<html lang="en">
<head>
  <meta charset="UTF-8">

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .score-board {
      background: #282828;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #1db954;
      display: inline-block;
      margin-bottom: 12px;
    }
    .card-id {
      color: #1db954;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }
    h1 { color: #ffffff; font-size: 22px; margin: 5px 0; }
    p { color: #b3b3b3; font-size: 13px; margin-bottom: 15px; }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="number"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #282828;
      color: #fff;
      font-size: 14px;
      text-align: center;
    }
    .btn-select {
      padding: 10px 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qr {
      width: 100%;
      padding: 10px;
      background-color: #2980b9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
    }
    #qr-reader-container {
      display: none;
      background: #000;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
    }
    #qr-reader { width: 100%; }

    .timer-display {
      font-size: 14px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 8px;
    }

    .player-container {
      width: 100%;
      height: 80px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      background-color: #282828;
      position: relative;
    }
    #iframeWrapper {
      width: 100%;
      height: 100%;
    }
    .player-container iframe {
      width: 100%;
      height: 80px;
      border: 0;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    .btn-reveal { background-color: #1db954; color: #ffffff; }
    .btn-coin { background-color: #f1c40f; color: #000000; }

    .answer-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #282828;
      border-radius: 8px;
      display: none;
      border: 1px solid #1db954;
    }
    .song-title { font-size: 18px; font-weight: bold; color: #ffffff; }
    .artist-name { font-size: 14px; color: #b3b3b3; margin-top: 4px; }
    .release-year { font-size: 30px; font-weight: bold; color: #1db954; margin-top: 6px; }
  </style>
</head>

    <div class="input-group">

      <button class="btn-select" onclick="loadManualCard()">Go</button>
    </div>

    <button class="btn-qr" onclick="startScanner()">📷 Scan Card QR Code</button>

    <div id="qr-reader-container">

    </div>

    <div class="card-id" id="cardDisplayId">CARD ---</div>

    function startScanner() {
      const container = document.getElementById("qr-reader-container");
      container.style.display = "block";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        (decodedText) => {
          const matchedId = decodedText.match(/id=(\d+)/) || decodedText.match(/^(\d+)$/);
          if (matchedId) {
            const cardNum = parseInt(matchedId[1]);
            html5QrCode.stop().then(() => {
              container.style.display = "none";
              loadCard(cardNum);
            }).catch(() => {
              container.style.display = "none";
              loadCard(cardNum);
            });
          }
        },
        () => {}
      ).catch(() => {
        alert("Camera permission denied or unavailable.");
        container.style.display = "none";
      });
    }

    function loadCard(id) {
      let currentSong = songs[id] || songs["1"];
      
      document.getElementById("cardDisplayId").innerText = "CARD " + String(id).padStart(3, '0');
      
      const wrapper = document.getElementById("iframeWrapper");
      wrapper.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${currentSong.spotifyId}?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
      
      document.getElementById("answerBox").style.display = "none";
      document.getElementById("revealBtn").innerText = "👁 Reveal Song, Artist & Year";
      document.getElementById("timerText").innerText = "⏱ Tap play on Spotify player below";

      document.getElementById("songTitle").innerText = currentSong.title;
      document.getElementById("artistName").innerText = "Artist: " + currentSong.artist;
      document.getElementById("releaseYear").innerText = currentSong.year;
    }

    function loadManualCard() {
      const inputVal = parseInt(document.getElementById("manualCardInput").value);
      if (inputVal > 0) {
        loadCard(inputVal);
      } else {
        alert("Please enter a valid card number greater than 0.");
      }
    }

    function toggleRevealAnswer() {
      const answerBox = document.getElementById("answerBox");
      const revealBtn = document.getElementById("revealBtn");

      if (answerBox.style.display === "block") {
        answerBox.style.display = "none";
        revealBtn.innerText = "👁 Reveal Song, Artist & Year";
      } else {
        answerBox.style.display = "block";
        revealBtn.innerText = "🔒 Hide Answer";
      }
    }

    function addCoin() {
      coins++;
      document.getElementById("coinCount").innerText = coins;
    }

    // Initial load
    loadCard(1);
