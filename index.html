<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Hitster - Self Hosted</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .score-board {
      background: #282828;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #1db954;
      display: inline-block;
      margin-bottom: 12px;
    }
    .card-id {
      color: #1db954;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }
    h1 { color: #ffffff; font-size: 22px; margin: 5px 0; }
    p { color: #b3b3b3; font-size: 13px; margin-bottom: 15px; }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="number"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #282828;
      color: #fff;
      font-size: 14px;
      text-align: center;
    }
    .btn-select {
      padding: 10px 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qr {
      width: 100%;
      padding: 10px;
      background-color: #2980b9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
    }
    #qr-reader-container {
      display: none;
      background: #000;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
    }
    #qr-reader { width: 100%; }

    .timer-display {
      font-size: 15px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 12px;
    }

    .player-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-player {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-play { background-color: #1db954; color: #fff; }
    .btn-pause { background-color: #e74c3c; color: #fff; }

    .btn-action {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    .btn-reveal { background-color: #1db954; color: #ffffff; }
    .btn-coin { background-color: #f1c40f; color: #000000; }

    .answer-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #282828;
      border-radius: 8px;
      display: none;
      border: 1px solid #1db954;
    }
    .song-title { font-size: 18px; font-weight: bold; color: #ffffff; }
    .artist-name { font-size: 14px; color: #b3b3b3; margin-top: 4px; }
    .release-year { font-size: 30px; font-weight: bold; color: #1db954; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="score-board">🪙 Hitster Coins: <span id="coinCount">0</span></div>
    
    <div class="input-group">
      <input type="number" id="manualCardInput" placeholder="Enter Card # (1-50)" min="1" max="50">
      <button class="btn-select" onclick="loadManualCard()">Go</button>
    </div>

    <button class="btn-qr" onclick="startScanner()">📷 Scan Card QR Code</button>

    <div id="qr-reader-container">
      <div id="qr-reader"></div>
    </div>

    <div class="card-id" id="cardDisplayId">CARD ---</div>
    <h1>🎵 Indian Hitster</h1>
    <p>Listen to the clip, guess the release year, and flip!</p>

    <div class="timer-display" id="timerText">⏱ 30s Ready</div>

    <div class="player-controls">
      <button class="btn-player btn-play" onclick="playAudioClip()">▶ Play Clip</button>
      <button class="btn-player btn-pause" onclick="pauseAudioClip()">⏸ Pause</button>
    </div>

    <button class="btn-action btn-reveal" id="revealBtn" onclick="toggleRevealAnswer()">👁 Reveal Song, Artist & Year</button>

    <div id="answerBox" class="answer-box">
      <div class="song-title" id="songTitle">---</div>
      <div class="artist-name" id="artistName">---</div>
      <div class="release-year" id="releaseYear">----</div>
      <button class="btn-action btn-coin" onclick="addCoin()">+1 Hitster Coin!</button>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    let coins = 0;
    let html5QrCode = null;
    let timerInterval = null;
    let timeLeft = 30;
    const audio = document.getElementById("audioPlayer");

    // Add your direct audio file URLs here (.mp3 links from cloud storage, local folder, etc.)
    const songs = {
      "1": { "title": "Rehnaa Hai Tere Dil Mein", "artist": "Sonu Nigam", "year": "2001", "audioUrl": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      "2": { "title": "Tu Tu Hai Wahi", "artist": "Vaishali", "year": "2013", "audioUrl": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      // Add more songs here...
    };

    function startScanner() {
      const container = document.getElementById("qr-reader-container");
      container.style.display = "block";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        (decodedText) => {
          // Extracts any raw number from the QR code (e.g. scanning "1" or "Card 1")
          const matchedId = decodedText.match(/\d+/);
          if (matchedId) {
            const cardNum = parseInt(matchedId[0]);
            html5QrCode.stop().then(() => {
              container.style.display = "none";
              loadCard(cardNum);
            }).catch(() => {
              container.style.display = "none";
              loadCard(cardNum);
            });
          }
        },
        () => {}
      ).catch(() => {
        alert("Camera permission denied or unavailable.");
        container.style.display = "none";
      });
    }

    function loadCard(id) {
      audio.pause();
      clearInterval(timerInterval);
      timeLeft = 30;
      document.getElementById("timerText").innerText = "⏱ 30s Ready";

      let currentSong = songs[id] || songs["1"];
      document.getElementById("cardDisplayId").innerText = "CARD " + String(id).padStart(3, '0');
      
      audio.src = currentSong.audioUrl;
      
      document.getElementById("answerBox").style.display = "none";
      document.getElementById("revealBtn").innerText = "👁 Reveal Song, Artist & Year";

      document.getElementById("songTitle").innerText = currentSong.title;
      document.getElementById("artistName").innerText = "Artist: " + currentSong.artist;
      document.getElementById("releaseYear").innerText = currentSong.year;
    }

    function playAudioClip() {
      audio.play();
      clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timerText").innerText = "⏱ Time Remaining: " + timeLeft + "s";
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          audio.pause();
          document.getElementById("timerText").innerText = "⏱ Time's Up!";
        }
      }, 1000);
    }

    function pauseAudioClip() {
      audio.pause();
      clearInterval(timerInterval);
      document.getElementById("timerText").innerText = "⏱ Paused (" + timeLeft + "s left)";
    }

    function loadManualCard() {
      const inputVal = parseInt(document.getElementById("manualCardInput").value);
      if (inputVal > 0) {
        loadCard(inputVal);
      } else {
        alert("Please enter a valid card number.");
      }
    }

    function toggleRevealAnswer() {
      const answerBox = document.getElementById("answerBox");
      const revealBtn = document.getElementById("revealBtn");

      if (answerBox.style.display === "block") {
        answerBox.style.display = "none";
        revealBtn.innerText = "👁 Reveal Song, Artist & Year";
      } else {
        audio.pause();
        clearInterval(timerInterval);
        answerBox.style.display = "block";
        revealBtn.innerText = "🔒 Hide Answer";
      }
    }

    function addCoin() {
      coins++;
      document.getElementById("coinCount").innerText = coins;
    }

    loadCard(1);
  </script>
</body>
</html>
