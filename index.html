<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Hitster - Secret Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .card-id {
      color: #1db954;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
    }
    h1 { color: #ffffff; font-size: 22px; margin: 10px 0 8px; }
    p { color: #b3b3b3; font-size: 13px; margin-bottom: 20px; }
    
    /* Container styled to fit the Spotify player cleanly */
    .player-container {
      width: 100%;
      height: 152px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      background-color: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    
    .btn-reveal {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background-color: #1db954;
      color: #ffffff;
    }
    .answer-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #282828;
      border-radius: 8px;
      display: none;
      border: 1px solid #1db954;
    }
    .song-title { font-size: 18px; font-weight: bold; color: #ffffff; }
    .artist-name { font-size: 14px; color: #b3b3b3; margin-top: 4px; }
    .release-year { font-size: 32px; font-weight: bold; color: #1db954; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-id" id="cardDisplayId">CARD ---</div>
    <h1>🎵 Indian Hitster</h1>
    <p>Press Play below to listen. Guess the song & year before revealing!</p>

    <!-- Spotify Audio Player -->
    <div class="player-container">
      <iframe id="spotifyPlayer" src="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <button class="btn-reveal" onclick="revealAnswer()">👁 Reveal Song, Artist & Year</button>

    <div id="answerBox" class="answer-box">
      <div class="song-title" id="songTitle">---</div>
      <div class="artist-name" id="artistName">---</div>
      <div class="release-year" id="releaseYear">----</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cardId = parseInt(urlParams.get('id')) || 1;

    // Database with verified Spotify Track IDs
    const songs = {
      1: { title: "Mere Sapno Ki Rani", artist: "Kishore Kumar", year: "1969", spotifyId: "1P2MllvM6aP4W5x17A612r" },
      2: { title: "Pyaar Deewana Hota Hai", artist: "Kishore Kumar", year: "1971", spotifyId: "6pA3Vq0R4fA3x6L2p1D1A2" },
      3: { title: "Dum Maro Dum", artist: "Asha Bhosle", year: "1971", spotifyId: "0L3R5W8X9Y7Z6A5B4C3D2E" }
    };

    const currentSong = songs[cardId] || songs[1];
    
    document.getElementById("cardDisplayId").innerText = "CARD " + String(cardId).padStart(3, '0');
    document.getElementById("spotifyPlayer").src = "https://open.spotify.com/embed/track/" + currentSong.spotifyId + "?utm_source=generator&theme=0";

    function revealAnswer() {
      document.getElementById("songTitle").innerText = currentSong.title;
      document.getElementById("artistName").innerText = "Artist: " + currentSong.artist;
      document.getElementById("releaseYear").innerText = currentSong.year;
      document.getElementById("answerBox").style.display = "block";
    }
  </script>

</body>
</html>
